name: Storage Server Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-static-linux:
    name: Build Static Linux AMD64
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          set -e

          git fetch --tags

          git submodule update \
            --init \
            --recursive \
            --depth=1 \
            --jobs=4


      # ============================================================
      # BUILD INSIDE UBUNTU 20.04
      # ============================================================

      - name: Build in Ubuntu 20.04
        shell: bash
        run: |
          set -e

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -c '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              echo "================================================"
              echo "BUILD ENVIRONMENT"
              echo "================================================"

              cat /etc/os-release

              echo ""
              echo "Architecture:"
              uname -m


              # ==================================================
              # PREPARE ENVIRONMENT
              # ==================================================

              echo ""
              echo "================================================"
              echo "PREPARE ENVIRONMENT"
              echo "================================================"

              echo "man-db man-db/auto-update boolean false" \
                | debconf-set-selections


              # ==================================================
              # INSTALL DEPENDENCIES
              # ==================================================

              echo ""
              echo "================================================"
              echo "INSTALL DEPENDENCIES"
              echo "================================================"

              apt-get update

              apt-get install -y \
                eatmydata \
                wget \
                software-properties-common

              eatmydata apt-get dist-upgrade -y

              add-apt-repository -y \
                ppa:ubuntu-toolchain-r/test

              apt-get update

              eatmydata apt-get install -y \
                --no-install-recommends \
                build-essential \
                git \
                ca-certificates \
                ninja-build \
                ccache \
                autoconf \
                automake \
                file \
                libtool \
                make \
                openssh-client \
                patch \
                pkg-config \
                gcc-10 \
                g++-10 \
                python3


              # ==================================================
              # GCC 10
              # ==================================================

              echo ""
              echo "================================================"
              echo "CONFIGURE GCC 10"
              echo "================================================"

              update-alternatives \
                --install \
                /usr/bin/gcc \
                gcc \
                /usr/bin/gcc-10 \
                100

              update-alternatives \
                --install \
                /usr/bin/g++ \
                g++ \
                /usr/bin/g++-10 \
                100

              gcc --version
              g++ --version

              which gcc
              which g++


              # ==================================================
              # INSTALL CMAKE 3.27.8
              # ==================================================

              echo ""
              echo "================================================"
              echo "INSTALL CMAKE 3.27.8"
              echo "================================================"

              cd /workspace

              wget -q \
                https://github.com/Kitware/CMake/releases/download/v3.27.8/cmake-3.27.8-linux-x86_64.sh

              sh cmake-3.27.8-linux-x86_64.sh \
                --skip-license \
                --prefix=/usr/local

              cmake --version


              # ==================================================
              # PATCH CURL
              # ==================================================

              echo ""
              echo "================================================"
              echo "PATCH CURL"
              echo "================================================"

              python3 - <<PY
from pathlib import Path

path = Path("/workspace/cmake/StaticBuild.cmake")

if not path.exists():
    print("ERROR: cmake/StaticBuild.cmake not found")
    raise SystemExit(1)

text = path.read_text()

old = "--without-zsh-functions-dir --without-fish-functions-dir"

new = (
    "--without-zsh-functions-dir "
    "--without-fish-functions-dir "
    "--without-zstd"
)

if "--without-zstd" in text:
    print("ZSTD is already disabled.")

elif old in text:
    text = text.replace(old, new, 1)
    path.write_text(text)
    print("Added --without-zstd.")

else:
    raise SystemExit(
        "Could not find expected curl configuration line "
        "in cmake/StaticBuild.cmake"
    )
PY

              grep -n -A3 -B3 \
                "without-zstd" \
                /workspace/cmake/StaticBuild.cmake


              # ==================================================
              # CONFIGURE BUILD
              # ==================================================

              echo ""
              echo "================================================"
              echo "CONFIGURE BUILD"
              echo "================================================"

              rm -rf /workspace/build

              mkdir -p /workspace/build

              cd /workspace/build

              CC=/usr/bin/gcc-10 \
              CXX=/usr/bin/g++-10 \
              cmake /workspace \
                -G Ninja \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_CXX_EXTENSIONS=OFF \
                -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always" \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
                -DCMAKE_BUILD_TYPE=Release \
                -DLOCAL_MIRROR=https://oxen.rocks/deps \
                -DUSE_LTO=ON \
                -DBUILD_TESTS=OFF \
                -DBUILD_STATIC_DEPS=ON


              # ==================================================
              # BUILD
              # ==================================================

              echo ""
              echo "================================================"
              echo "BUILD"
              echo "================================================"

              ninja -v


              # ==================================================
              # FIND BUILD OUTPUTS
              # ==================================================

              echo ""
              echo "================================================"
              echo "FIND BUILD OUTPUTS"
              echo "================================================"

              echo "All executable files:"

              find /workspace/build \
                -type f \
                -executable \
                -print \
                | sort


              echo ""
              echo "Files containing beldex-storage:"

              find /workspace/build \
                -type f \
                \( \
                  -name "beldex-storage" \
                  -o \
                  -name "*beldex*storage*" \
                \) \
                -print \
                | sort


              # ==================================================
              # LOCATE BELDEX STORAGE BINARY
              # ==================================================

              echo ""
              echo "================================================"
              echo "LOCATE BELDEX STORAGE BINARY"
              echo "================================================"

              BINARY=$(find /workspace/build \
                -type f \
                -name "beldex-storage" \
                -executable \
                -print \
                -quit)

              if [ -z "$BINARY" ]; then

                echo ""
                echo "ERROR: beldex-storage executable was not found."

                echo ""
                echo "Build directory:"
                find /workspace/build \
                  -maxdepth 4 \
                  -type f \
                  -print \
                  | sort

                exit 1
              fi

              echo "BINARY FOUND:"
              echo "$BINARY"


              # ==================================================
              # CHECK BINARY
              # ==================================================

              echo ""
              echo "================================================"
              echo "CHECK BINARY"
              echo "================================================"

              "$BINARY" --version || true


              # ==================================================
              # CHECK BINARY DEPENDENCIES
              # ==================================================

              echo ""
              echo "================================================"
              echo "CHECK BINARY DEPENDENCIES"
              echo "================================================"

              echo "ldd output:"

              ldd "$BINARY" || true

              echo ""
              echo "GLIBC requirements:"

              strings "$BINARY" \
                | grep "^GLIBC_" \
                | sort -Vu \
                | tail -20 \
                || true

              echo ""
              echo "GLIBCXX requirements:"

              strings "$BINARY" \
                | grep "^GLIBCXX_" \
                | sort -Vu \
                | tail -20 \
                || true


              # ==================================================
              # STRIP
              # ==================================================

              echo ""
              echo "================================================"
              echo "STRIP"
              echo "================================================"

              cd /workspace/build

              ninja strip || true


              # ==================================================
              # CREATE PACKAGE
              # ==================================================

              echo ""
              echo "================================================"
              echo "CREATE PACKAGE"
              echo "================================================"

              ninja create_tarxz


              # ==================================================
              # PREPARE DEPLOYMENT FILES
              # ==================================================

              echo ""
              echo "================================================"
              echo "PREPARE DEPLOYMENT FILES"
              echo "================================================"

              rm -rf /workspace/deploy

              mkdir -p /workspace/deploy


              # ==================================================
              # COPY BINARY
              # ==================================================

              if [ ! -f "$BINARY" ]; then
                echo "ERROR: Binary disappeared after build."
                exit 1
              fi

              cp \
                "$BINARY" \
                /workspace/deploy/beldex-storage


              # ==================================================
              # FIND GENERATED PACKAGE
              # ==================================================

              PACKAGE=$(find /workspace/build \
                -maxdepth 1 \
                -type f \
                -name "*.tar.xz" \
                -print \
                -quit)

              if [ -z "$PACKAGE" ]; then

                echo "ERROR: No .tar.xz package was generated."

                echo ""
                echo "Build directory contents:"

                find /workspace/build \
                  -maxdepth 2 \
                  -type f \
                  | sort

                exit 1
              fi

              echo "Package found:"
              echo "$PACKAGE"


              # ==================================================
              # COPY PACKAGE
              # ==================================================

              cp \
                "$PACKAGE" \
                /workspace/deploy/beldex-storage-linux-amd64.tar.xz


              # ==================================================
              # FINAL VERIFICATION
              # ==================================================

              echo ""
              echo "================================================"
              echo "DEPLOYMENT FILES"
              echo "================================================"

              ls -lh /workspace/deploy/

              echo ""
              echo "Binary information:"

              file \
                /workspace/deploy/beldex-storage

              echo ""
              echo "Package information:"

              file \
                /workspace/deploy/beldex-storage-linux-amd64.tar.xz

            '


      # ============================================================
      # VERIFY FILES
      # ============================================================

      - name: Verify deployment files
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "VERIFY DEPLOYMENT FILES"
          echo "================================================"

          ls -lah deploy/

          test -f deploy/beldex-storage
          test -f deploy/beldex-storage-linux-amd64.tar.xz

          echo ""
          echo "Binary:"
          file deploy/beldex-storage

          echo ""
          echo "Package:"
          file deploy/beldex-storage-linux-amd64.tar.xz


      # ============================================================
      # GITHUB ARTIFACT
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beldex-storage-linux-amd64
          path: deploy/
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # UPLOAD TO SERVER
      #
      # Pull requests do not deploy.
      # main/master/manual runs deploy.
      # ============================================================

      - name: Upload build to server
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          source: "deploy/beldex-storage,deploy/beldex-storage-linux-amd64.tar.xz"

          target: ${{ secrets.SERVER_PATH }}

          strip_components: 1

          overwrite: true

          command_timeout: 10m


      # ============================================================
      # DEPLOYMENT COMPLETE
      # ============================================================

      - name: Deployment complete
        if: github.event_name != 'pull_request'
        run: |
          echo ""
          echo "================================================"
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "================================================"

          echo ""
          echo "Server:"
          echo "${{ secrets.SERVER_HOST }}"

          echo ""
          echo "Remote path:"
          echo "${{ secrets.SERVER_PATH }}"

          echo ""
          echo "Uploaded:"
          echo "  beldex-storage"
          echo "  beldex-storage-linux-amd64.tar.xz"

