name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          curl \
          libcurl4-openssl-dev \
          libssl-dev \
          libboost-all-dev \
          libjemalloc-dev \
          libsystemd-dev \
          libsodium-dev

    - name: Check CURL
      if: runner.os == 'Linux'
      run: |
        echo "=== curl ==="
        curl --version

        echo "=== libcurl version ==="
        pkg-config --modversion libcurl

        echo "=== libcurl flags ==="
        pkg-config --cflags --libs libcurl
    # macOS build removed; macOS-specific install step deleted

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        choco install -y cmake --installargs '"ADD_CMAKE_TO_PATH=System"'
        choco install -y ninja
        choco install -y pkgconfiglite

    - name: Configure
      run: cmake -S . -B build -G Ninja -DDOWNLOAD_SODIUM=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -- -j2

    - name: Run tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p artifact
        tar -C build/httpserver -cJf artifact/beldex-storage-linux-${{ matrix.build_type }}.tar.xz beldex-storage

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path artifact -Force
        Compress-Archive -Path build/httpserver/* -DestinationPath artifact\beldex-storage-windows-${{ matrix.build_type }}.zip

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v4
      with:
        name: beldex-storage
        path: artifact/**

  deploy:
    name: Build and deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive 
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: beldex-storage
          path: ./artifact

      - name: Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: ./artifact/*
          target: ${{ secrets.DEPLOY_PATH }}
