name: Storage-server-build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-static-linux:
    name: Build static Linux AMD64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive --depth=1 --jobs=4

      - name: Prepare environment
        run: |
          export DEBIAN_FRONTEND=noninteractive

          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections

      - name: Install GCC 10 and build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            eatmydata \
            wget \
            software-properties-common

          sudo eatmydata apt-get dist-upgrade -y

          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

          sudo apt-get update

          sudo eatmydata apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ca-certificates \
            ninja-build \
            ccache \
            autoconf \
            automake \
            file \
            libtool \
            make \
            openssh-client \
            patch \
            pkg-config \
            gcc-10 \
            g++-10

      - name: Configure GCC 10
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100

          gcc --version
          g++ --version

      - name: Install CMake 3.27.8
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.27.8/cmake-3.27.8-linux-x86_64.sh

          sudo sh cmake-3.27.8-linux-x86_64.sh \
            --skip-license \
            --prefix=/usr/local

          cmake --version

      - name: Patch curl to disable ZSTD
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cmake/StaticBuild.cmake")
          text = path.read_text()

          old = "--without-zsh-functions-dir --without-fish-functions-dir"
          new = "--without-zsh-functions-dir --without-fish-functions-dir --without-zstd"

          if "--without-zstd" in text:
              print("ZSTD is already disabled in curl configuration.")
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Added --without-zstd to curl configuration.")
          else:
              raise SystemExit(
                  "Could not find the expected curl configuration line "
                  "in cmake/StaticBuild.cmake"
              )
          PY

          echo "Checking curl ZSTD configuration:"
          grep -n -A3 -B3 "without-zstd" cmake/StaticBuild.cmake

      - name: Configure build
        run: |
          rm -rf build

          mkdir -p build
          cd build

          cmake .. \
            -G Ninja \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLOCAL_MIRROR=https://oxen.rocks/deps \
            -DUSE_LTO=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_STATIC_DEPS=ON

      - name: Build
        run: |
          cd build
          ninja -v

      - name: Check beldex-storage
        run: |
          ./build/httpserver/beldex-storage --version

      - name: Strip binaries
        run: |
          cd build
          ninja strip

      - name: Create package
        run: |
          cd build
          ninja create_tarxz

      - name: Upload build artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: beldex-storage-linux-amd64
          path: |
            build/**/*.tar.xz
            build/httpserver/beldex-storage

      - name: Upload build to EC2 server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: |
            build/**/*.tar.xz
            build/httpserver/beldex-storage
          target: /home/ubuntu/

