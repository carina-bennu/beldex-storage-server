name: Storage Server Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-static-linux:
    name: Build Static Linux AMD64
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          git fetch --tags
          git submodule update --init --recursive --depth=1 --jobs=4


      # ============================================================
      # Build inside Ubuntu 20.04 / Focal
      # ============================================================

      - name: Build in Ubuntu 20.04 container
        run: |
          set -e

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -c '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              echo "=============================================="
              echo "Build environment"
              echo "=============================================="

              cat /etc/os-release
              uname -m

              echo ""
              echo "=============================================="
              echo "Install dependencies"
              echo "=============================================="

              echo "man-db man-db/auto-update boolean false" \
                | debconf-set-selections

              apt-get update

              apt-get install -y \
                eatmydata \
                wget \
                software-properties-common

              eatmydata apt-get dist-upgrade -y

              add-apt-repository -y ppa:ubuntu-toolchain-r/test

              apt-get update

              eatmydata apt-get install -y --no-install-recommends \
                build-essential \
                git \
                ca-certificates \
                ninja-build \
                ccache \
                autoconf \
                automake \
                file \
                libtool \
                make \
                openssh-client \
                patch \
                pkg-config \
                gcc-10 \
                g++-10 \
                python3

              echo ""
              echo "=============================================="
              echo "Configure GCC 10"
              echo "=============================================="

              update-alternatives \
                --install /usr/bin/gcc gcc /usr/bin/gcc-10 100

              update-alternatives \
                --install /usr/bin/g++ g++ /usr/bin/g++-10 100

              gcc --version
              g++ --version

              echo ""
              echo "=============================================="
              echo "Install CMake"
              echo "=============================================="

              cd /workspace

              wget -q \
                https://github.com/Kitware/CMake/releases/download/v3.27.8/cmake-3.27.8-linux-x86_64.sh

              sh cmake-3.27.8-linux-x86_64.sh \
                --skip-license \
                --prefix=/usr/local

              cmake --version

              echo ""
              echo "=============================================="
              echo "Patch curl"
              echo "=============================================="

              python3 - <<PY
          from pathlib import Path

          path = Path("cmake/StaticBuild.cmake")

          if not path.exists():
              print("cmake/StaticBuild.cmake not found.")
              raise SystemExit(1)

          text = path.read_text()

          old = "--without-zsh-functions-dir --without-fish-functions-dir"

          new = (
              "--without-zsh-functions-dir "
              "--without-fish-functions-dir "
              "--without-zstd"
          )

          if "--without-zstd" in text:
              print("ZSTD is already disabled.")

          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Added --without-zstd.")

          else:
              raise SystemExit(
                  "Could not find expected curl configuration line."
              )
          PY

              grep -n -A3 -B3 \
                "without-zstd" \
                cmake/StaticBuild.cmake

              echo ""
              echo "=============================================="
              echo "Configure build"
              echo "=============================================="

              rm -rf build

              mkdir -p build

              cd build

              CC=/usr/bin/gcc-10 \
              CXX=/usr/bin/g++-10 \
              cmake .. \
                -G Ninja \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_CXX_EXTENSIONS=OFF \
                -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always" \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
                -DCMAKE_BUILD_TYPE=Release \
                -DLOCAL_MIRROR=https://oxen.rocks/deps \
                -DUSE_LTO=ON \
                -DBUILD_TESTS=OFF \
                -DBUILD_STATIC_DEPS=ON

              echo ""
              echo "=============================================="
              echo "Build"
              echo "=============================================="

              ninja -v

              echo ""
              echo "=============================================="
              echo "Check binary"
              echo "=============================================="

              ./httpserver/beldex-storage --version

              echo ""
              echo "=============================================="
              echo "Strip"
              echo "=============================================="

              ninja strip

              echo ""
              echo "=============================================="
              echo "Create package"
              echo "=============================================="

              ninja create_tarxz

              echo ""
              echo "=============================================="
              echo "Build output"
              echo "=============================================="

              find build \
                -type f \
                \( -name "beldex-storage" -o -name "*.tar.xz" \) \
                -exec ls -lh {} \;

              echo ""
              echo "=============================================="
              echo "Prepare deployment"
              echo "=============================================="

              rm -rf deploy
              mkdir -p deploy

              cp \
                build/httpserver/beldex-storage \
                deploy/beldex-storage

              PACKAGE=$(find build \
                -type f \
                -name "*.tar.xz" \
                -print \
                -quit)

              if [ -z "$PACKAGE" ]; then
                echo "ERROR: No .tar.xz package found."
                exit 1
              fi

              echo "Package:"
              echo "$PACKAGE"

              cp \
                "$PACKAGE" \
                deploy/beldex-storage-linux-amd64.tar.xz

              echo ""
              echo "Deployment files:"

              ls -lh deploy/
            '


      # ============================================================
      # Verify build produced files
      # ============================================================

      - name: Verify deployment files
        run: |
          set -e

          echo "Deployment files:"

          ls -lh deploy/

          test -f deploy/beldex-storage
          test -f deploy/beldex-storage-linux-amd64.tar.xz

          echo ""
          echo "Binary information:"
          file deploy/beldex-storage

          echo ""
          echo "Package information:"
          file deploy/beldex-storage-linux-amd64.tar.xz


      # ============================================================
      # Upload GitHub artifact
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beldex-storage-linux-amd64
          path: deploy/
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # Upload to EC2
      # ============================================================

      - name: Upload build to EC2 server
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "deploy/beldex-storage,deploy/beldex-storage-linux-amd64.tar.xz"
          target: "/home/ubuntu/"


      # ============================================================
      # Summary
      # ============================================================

      - name: Deployment complete
        if: github.event_name != 'pull_request'
        run: |
          echo ""
          echo "=============================================="
          echo "Deployment completed successfully"
          echo "=============================================="
          echo ""
          echo "Uploaded:"
          echo "  /home/ubuntu/beldex-storage"
          echo "  /home/ubuntu/beldex-storage-linux-amd64.tar.xz"

