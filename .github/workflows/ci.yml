name: Storage Server Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-static-linux:
    name: Build Static Linux AMD64
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          set -e

          git fetch --tags

          git submodule update \
            --init \
            --recursive \
            --depth=1 \
            --jobs=4


      # ============================================================
      # BUILD INSIDE UBUNTU 20.04
      # ============================================================

      - name: Build in Ubuntu 20.04
        shell: bash
        run: |
          set -e

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -c '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              echo "================================================"
              echo "BUILD ENVIRONMENT"
              echo "================================================"

              cat /etc/os-release

              echo ""
              echo "Architecture:"
              uname -m


              # ==================================================
              # PREPARE ENVIRONMENT
              # ==================================================

              echo ""
              echo "================================================"
              echo "PREPARE ENVIRONMENT"
              echo "================================================"

              echo "man-db man-db/auto-update boolean false" \
                | debconf-set-selections


              # ==================================================
              # INSTALL DEPENDENCIES
              # ==================================================

              echo ""
              echo "================================================"
              echo "INSTALL DEPENDENCIES"
              echo "================================================"

              apt-get update

              apt-get install -y \
                eatmydata \
                wget \
                software-properties-common

              eatmydata apt-get dist-upgrade -y

              add-apt-repository -y \
                ppa:ubuntu-toolchain-r/test

              apt-get update

              eatmydata apt-get install -y \
                --no-install-recommends \
                build-essential \
                git \
                ca-certificates \
                ninja-build \
                ccache \
                autoconf \
                automake \
                file \
                libtool \
                make \
                openssh-client \
                patch \
                pkg-config \
                gcc-10 \
                g++-10 \
                python3 \
                tar \
                xz-utils


              # ==================================================
              # GCC 10
              # ==================================================

              echo ""
              echo "================================================"
              echo "CONFIGURE GCC 10"
              echo "================================================"

              update-alternatives \
                --install \
                /usr/bin/gcc \
                gcc \
                /usr/bin/gcc-10 \
                100

              update-alternatives \
                --install \
                /usr/bin/g++ \
                g++ \
                /usr/bin/g++-10 \
                100

              echo ""
              echo "GCC:"
              gcc --version

              echo ""
              echo "G++:"
              g++ --version

              echo ""
              echo "Compiler paths:"
              which gcc
              which g++


              # ==================================================
              # INSTALL CMAKE 3.27.8
              # ==================================================

              echo ""
              echo "================================================"
              echo "INSTALL CMAKE 3.27.8"
              echo "================================================"

              cd /workspace

              wget -q \
                https://github.com/Kitware/CMake/releases/download/v3.27.8/cmake-3.27.8-linux-x86_64.sh

              sh cmake-3.27.8-linux-x86_64.sh \
                --skip-license \
                --prefix=/usr/local

              cmake --version


              # ==================================================
              # PATCH CURL
              # ==================================================

              echo ""
              echo "================================================"
              echo "PATCH CURL"
              echo "================================================"

              CURL_FILE="/workspace/cmake/StaticBuild.cmake"

              if [ ! -f "$CURL_FILE" ]; then
                echo "ERROR: $CURL_FILE not found"
                exit 1
              fi

              if grep -q -- "--without-zstd" "$CURL_FILE"; then

                echo "ZSTD is already disabled."

              elif grep -q \
                -- "--without-zsh-functions-dir --without-fish-functions-dir" \
                "$CURL_FILE"; then

                sed -i \
                  "s|--without-zsh-functions-dir --without-fish-functions-dir|--without-zsh-functions-dir --without-fish-functions-dir --without-zstd|" \
                  "$CURL_FILE"

                echo "Added --without-zstd."

              else

                echo "ERROR: Could not find expected curl configuration line."
                exit 1

              fi

              echo ""
              echo "Curl configuration:"

              grep -n -A3 -B3 \
                "without-zstd" \
                "$CURL_FILE"


              # ==================================================
              # CONFIGURE BUILD
              # ==================================================

              echo ""
              echo "================================================"
              echo "CONFIGURE BUILD"
              echo "================================================"

              rm -rf /workspace/build

              mkdir -p /workspace/build

              cd /workspace/build

              CC=/usr/bin/gcc-10 \
              CXX=/usr/bin/g++-10 \
              cmake /workspace \
                -G Ninja \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_CXX_EXTENSIONS=OFF \
                -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always" \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
                -DCMAKE_BUILD_TYPE=Release \
                -DLOCAL_MIRROR=https://oxen.rocks/deps \
                -DUSE_LTO=ON \
                -DBUILD_TESTS=OFF \
                -DBUILD_STATIC_DEPS=ON


              # ==================================================
              # BUILD
              # ==================================================

              echo ""
              echo "================================================"
              echo "BUILD"
              echo "================================================"

              ninja -v


              # ==================================================
              # FIND BUILD OUTPUTS
              # ==================================================

              echo ""
              echo "================================================"
              echo "FIND BUILD OUTPUTS"
              echo "================================================"

              echo ""
              echo "Executable files:"

              find /workspace/build \
                -type f \
                -executable \
                -print \
                | sort

              echo ""
              echo "Files named beldex-storage:"

              find /workspace/build \
                -type f \
                -name "beldex-storage" \
                -print \
                | sort


              # ==================================================
              # LOCATE BELDEX STORAGE BINARY
              # ==================================================

              echo ""
              echo "================================================"
              echo "LOCATE BELDEX STORAGE BINARY"
              echo "================================================"

              BINARY=$(find /workspace/build \
                -type f \
                -name "beldex-storage" \
                -print \
                -quit)

              if [ -z "$BINARY" ]; then

                echo ""
                echo "ERROR: beldex-storage binary was not found."

                echo ""
                echo "All build files:"

                find /workspace/build \
                  -maxdepth 5 \
                  -type f \
                  -print \
                  | sort

                echo ""
                echo "All executables:"

                find /workspace/build \
                  -type f \
                  -executable \
                  -print \
                  | sort

                exit 1

              fi

              chmod +x "$BINARY"

              echo ""
              echo "BINARY FOUND:"
              echo "$BINARY"


              # ==================================================
              # CHECK BINARY
              # ==================================================

              echo ""
              echo "================================================"
              echo "CHECK BINARY"
              echo "================================================"

              "$BINARY" --version || true


              # ==================================================
              # CHECK BINARY DEPENDENCIES
              # ==================================================

              echo ""
              echo "================================================"
              echo "CHECK BINARY DEPENDENCIES"
              echo "================================================"

              echo ""
              echo "ldd output:"

              ldd "$BINARY" || true

              echo ""
              echo "GLIBC requirements:"

              strings "$BINARY" \
                | grep "^GLIBC_" \
                | sort -Vu \
                | tail -20 \
                || true

              echo ""
              echo "GLIBCXX requirements:"

              strings "$BINARY" \
                | grep "^GLIBCXX_" \
                | sort -Vu \
                | tail -20 \
                || true


              # ==================================================
              # STRIP
              # ==================================================

              echo ""
              echo "================================================"
              echo "STRIP"
              echo "================================================"

              cd /workspace/build

              ninja strip || true


              # ==================================================
              # CREATE PACKAGE
              # ==================================================

              echo ""
              echo "================================================"
              echo "CREATE PACKAGE"
              echo "================================================"

              ninja create_tarxz


              # ==================================================
              # SHOW BUILD OUTPUT
              # ==================================================

              echo ""
              echo "================================================"
              echo "BUILD OUTPUT"
              echo "================================================"

              echo ""
              echo "Binary:"

              ls -lh "$BINARY"

              echo ""
              echo "Packages:"

              find /workspace/build \
                -maxdepth 1 \
                -type f \
                -name "*.tar.xz" \
                -print \
                -exec ls -lh {} \;


              # ==================================================
              # PREPARE DEPLOYMENT FILES
              # ==================================================

              echo ""
              echo "================================================"
              echo "PREPARE DEPLOYMENT FILES"
              echo "================================================"

              rm -rf /workspace/deploy

              mkdir -p /workspace/deploy


              # ==================================================
              # COPY BINARY
              # ==================================================

              if [ ! -f "$BINARY" ]; then
                echo "ERROR: Binary not found."
                exit 1
              fi

              cp \
                "$BINARY" \
                /workspace/deploy/beldex-storage


              # ==================================================
              # FIND GENERATED PACKAGE
              # ==================================================

              PACKAGE=$(find /workspace/build \
                -maxdepth 1 \
                -type f \
                -name "*.tar.xz" \
                -print \
                -quit)

              if [ -z "$PACKAGE" ]; then

                echo "ERROR: No .tar.xz package was generated."

                echo ""
                echo "Build directory contents:"

                find /workspace/build \
                  -maxdepth 3 \
                  -type f \
                  | sort

                exit 1

              fi

              echo ""
              echo "Package found:"
              echo "$PACKAGE"


              # ==================================================
              # COPY PACKAGE WITH PREDICTABLE NAME
              # ==================================================

              cp \
                "$PACKAGE" \
                /workspace/deploy/beldex-storage-linux-amd64.tar.xz


              # ==================================================
              # FINAL VERIFICATION
              # ==================================================

              echo ""
              echo "================================================"
              echo "DEPLOYMENT FILES"
              echo "================================================"

              ls -lh /workspace/deploy/

              echo ""
              echo "Binary information:"

              file \
                /workspace/deploy/beldex-storage

              echo ""
              echo "Package information:"

              file \
                /workspace/deploy/beldex-storage-linux-amd64.tar.xz

            '


      # ============================================================
      # VERIFY DEPLOYMENT FILES
      # ============================================================

      - name: Verify deployment files
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "VERIFY DEPLOYMENT FILES"
          echo "================================================"

          ls -lah deploy/

          test -f deploy/beldex-storage
          test -f deploy/beldex-storage-linux-amd64.tar.xz

          echo ""
          echo "Binary:"
          file deploy/beldex-storage

          echo ""
          echo "Package:"
          file deploy/beldex-storage-linux-amd64.tar.xz


      # ============================================================
      # UPLOAD ARTIFACT TO GITHUB
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beldex-storage-linux-amd64
          path: deploy/
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # PREPARE SSH
      # ============================================================

      - name: Prepare SSH
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -e

          echo "================================================"
          echo "PREPARE SSH"
          echo "================================================"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -p "$SERVER_PORT" \
            -H "$SERVER_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration prepared."


      # ============================================================
      # CREATE REMOTE DIRECTORY
      # ============================================================

      - name: Prepare server directory
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -e

          echo "================================================"
          echo "PREPARE SERVER DIRECTORY"
          echo "================================================"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$SERVER_PATH'"

          echo "Remote directory ready."


      # ============================================================
      # UPLOAD BUILD FILES TO SERVER
      # ============================================================

      - name: Upload build to server
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -e

          echo "================================================"
          echo "UPLOAD BUILD FILES"
          echo "================================================"

          echo ""
          echo "Uploading beldex-storage..."

          scp \
            -i ~/.ssh/deploy_key \
            -P "$SERVER_PORT" \
            deploy/beldex-storage \
            "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/beldex-storage"

          echo ""
          echo "Uploading package..."

          scp \
            -i ~/.ssh/deploy_key \
            -P "$SERVER_PORT" \
            deploy/beldex-storage-linux-amd64.tar.xz \
            "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/beldex-storage-linux-amd64.tar.xz"

          echo ""
          echo "Upload completed."


      # ============================================================
      # VERIFY REMOTE FILES
      # ============================================================

      - name: Verify remote deployment
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -e

          echo "================================================"
          echo "VERIFY REMOTE DEPLOYMENT"
          echo "================================================"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "ls -lh '$SERVER_PATH/beldex-storage' '$SERVER_PATH/beldex-storage-linux-amd64.tar.xz'"

          echo ""
          echo "Remote deployment verified successfully."


      # ============================================================
      # DEPLOYMENT COMPLETE
      # ============================================================

      - name: Deployment complete
        if: github.event_name != 'pull_request'
        run: |
          echo ""
          echo "================================================"
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "================================================"

          echo ""
          echo "Build:"
          echo "  Linux AMD64"

          echo ""
          echo "Files:"
          echo "  beldex-storage"
          echo "  beldex-storage-linux-amd64.tar.xz"

          echo ""
          echo "The files were uploaded to the configured server."

